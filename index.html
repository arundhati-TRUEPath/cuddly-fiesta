<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Path Services — Ask Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Career Path Services — support chat widget (WIRED)
   Design: Claude Design export. Behavior: live /api/chat call.
   Brand: Open Sans; greens #6B861F / #55691A / #ADD136
   ============================================================ */

:root{
  --cps-green:#6B861F;
  --cps-green-dark:#55691A;   /* white text on this = 6.0:1 */
  --cps-green-light:#ADD136;
  --cps-gray:#5E6970;
  --cps-gray-light:#939EA5;
  --ink:#2B3136;              /* body text, 12.4:1 on white */
  --panel:#FFFFFF;
  --surface:#F4F5F3;
  --line:#DDE0DC;
  --focus:#1B3A6B;
  --radius:14px;
  --shadow:0 6px 24px rgba(43,49,54,.18);
}

html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  background:transparent;
  font-family:"Open Sans","Segoe UI",system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  color:var(--ink);
  -webkit-text-size-adjust:100%;
}
a{color:var(--cps-green-dark)}
a:hover{color:var(--cps-green)}

/* --- 1. collapsed launcher ----------------------------------- */
.cps-chat-launcher{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:64px;
  height:64px;
  border:none;
  border-radius:50%;
  background:var(--cps-green-dark);
  color:#fff;
  box-shadow:var(--shadow);
  cursor:pointer;
}
.cps-chat-launcher:hover{background:#4A5B16}
.cps-chat-launcher svg{width:30px;height:30px;display:block}
.cps-chat-launcher[hidden]{display:none}

/* --- 2. expanded panel -------------------------------------- */
.cps-chat-panel{
  display:flex;
  flex-direction:column;
  width:380px;
  height:560px;
  max-width:100vw;
  max-height:100vh;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.cps-chat-panel[hidden]{display:none}

/* header */
.cps-chat-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 12px 12px 18px;
  background:var(--cps-green-dark);
  color:#fff;
}
.cps-chat-logo{
  flex:none;
  width:38px;
  height:38px;
  border-radius:8px;
  background:#fff;
  padding:3px;
  object-fit:contain;
}
.cps-chat-title{
  margin:0;
  flex:1;
  min-width:0;
  font-size:17px;
  font-weight:600;
  line-height:1.25;
}
.cps-chat-title small{
  display:block;
  font-size:13px;
  font-weight:400;
  color:#E4EBD2;
}
.cps-chat-close{
  flex:none;
  width:44px;
  height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:none;
  border-radius:8px;
  background:transparent;
  color:#fff;
  cursor:pointer;
}
.cps-chat-close:hover{background:rgba(255,255,255,.18)}
.cps-chat-close svg{width:20px;height:20px;display:block}

/* scrolling conversation */
#log{
  flex:1 1 auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:18px 16px 8px;
  background:var(--surface);
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* message bubbles */
.msg{
  max-width:82%;
  padding:11px 15px;
  font-size:16px;
  line-height:1.45;
  border-radius:16px;
  overflow-wrap:break-word;
  text-wrap:pretty;
}
.msg.bot{
  align-self:flex-start;
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
  border-bottom-left-radius:5px;
}
.msg.user{
  align-self:flex-end;
  background:var(--cps-green-dark);
  color:#fff;
  border-bottom-right-radius:5px;
}
.msg p{margin:0;white-space:pre-line;word-break:break-word}
.msg p + p{margin-top:.6em}
.msg.bot a{
  color:var(--cps-green-dark);
  font-weight:600;
  text-decoration:underline;
  border-radius:3px;
  padding:2px 4px;
}
.msg.bot a:hover{
  background:rgba(85,105,26,0.1);
  text-decoration:none;
}
.msg.user a{color:#fff;text-decoration:underline}

/* typing indicator */
.typing{
  align-self:flex-start;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:14px 16px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  border-bottom-left-radius:5px;
}
.typing span{
  width:8px;height:8px;border-radius:50%;
  background:var(--cps-gray-light);
  animation:cps-typing 1.2s ease-in-out infinite;
}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes cps-typing{
  0%,60%,100%{opacity:.35;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-3px)}
}
@media (prefers-reduced-motion:reduce){
  .typing span{animation:none;opacity:.6}
}

/* example questions (empty state) */
.cps-chat-suggestions{
  align-self:stretch;
  list-style:none;
  margin:2px 0 6px;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.cps-chat-suggestions button{
  width:100%;
  min-height:44px;
  padding:10px 16px;
  text-align:left;
  font:inherit;
  font-size:16px;
  color:var(--cps-green-dark);
  background:#fff;
  border:1px solid var(--cps-green);
  border-radius:22px;
  cursor:pointer;
}
.cps-chat-suggestions button:hover{
  background:#F1F5E4;
  border-color:var(--cps-green-dark);
}

/* input row */
#form{
  flex:none;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:12px;
  background:#fff;
  border-top:1px solid var(--line);
}
#input{
  flex:1 1 auto;
  min-width:0;
  min-height:48px;
  padding:12px 14px;
  font:inherit;
  font-size:16px;
  color:var(--ink);
  background:#fff;
  border:1px solid var(--cps-gray-light);
  border-radius:24px;
}
#input::placeholder{color:#6C767C}
#send{
  flex:none;
  min-height:48px;
  min-width:48px;
  padding:0 20px;
  font:inherit;
  font-size:16px;
  font-weight:600;
  color:#fff;
  background:var(--cps-green-dark);
  border:none;
  border-radius:24px;
  cursor:pointer;
}
#send:hover{background:#4A5B16}
#send:disabled{background:var(--cps-gray-light);cursor:default}
#input:disabled{background:#F4F5F3}

/* disclaimer */
.cps-chat-disclaimer{
  flex:none;
  margin:0;
  padding:0 16px 14px;
  background:#fff;
  font-size:13px;
  line-height:1.45;
  color:#585F65;
}
.cps-chat-disclaimer a{color:var(--cps-green-dark);font-weight:600}

/* visible keyboard focus on every interactive element */
.cps-chat-launcher:focus-visible,
.cps-chat-close:focus-visible,
.cps-chat-suggestions button:focus-visible,
#input:focus-visible,
#send:focus-visible,
#log:focus-visible,
a:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
}
.cps-chat-close:focus-visible{outline-color:#fff}
#input:focus-visible{border-color:var(--focus)}
.cps-chat-launcher:focus,
.cps-chat-close:focus,
.cps-chat-suggestions button:focus,
#input:focus,
#send:focus{outline:3px solid var(--focus);outline-offset:2px}
.cps-chat-close:focus{outline-color:#fff}

/* screen-reader-only helper */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* real-site placement: bottom-right corner */
.cps-chat-dock{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9999;
}
@media (max-width:480px){
  .cps-chat-panel{width:100vw;height:100vh;border-radius:0;border:none}
  .cps-chat-dock{right:0;bottom:0}
  .cps-chat-dock:has(.cps-chat-panel:not([hidden])){right:0;bottom:0;top:0;left:0}
}
</style>
</head>

<script>
(function () {
  "use strict";

  var log        = document.getElementById('log');
  var form       = document.getElementById('form');
  var input      = document.getElementById('input');
  var send       = document.getElementById('send');
  var panel      = document.getElementById('chat-panel');
  var launcher   = document.getElementById('chat-launcher');
  var closeBtn   = document.getElementById('chat-close');
  var suggestions = document.getElementById('suggestions');

  var PHONE = '509-326-7520';

  // This array IS the bot's memory. It is resent in full on every request.
  var messages = [];
  var busy = false;

  function scrollDown() { log.scrollTop = log.scrollHeight; }

  // Build a bubble. Splits blank-line-separated text into paragraphs.
  // For bot messages: detects URLs and converts them to clickable links.
  // For user messages: uses textContent for safety.
  function bubble(text, who) {
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    String(text).trim().split(/\n{2,}/).forEach(function (part) {
      var p = document.createElement('p');

      if (who === 'bot') {
        // Parse URLs and create clickable links for bot messages
        var parts = part.trim().split(/(https?:\/\/[^\s]+)/);
        parts.forEach(function (segment) {
          if (/^https?:\/\//.test(segment)) {
            var a = document.createElement('a');
            a.href = segment;
            a.textContent = segment;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            p.appendChild(a);
          } else {
            p.appendChild(document.createTextNode(segment));
          }
        });
      } else {
        // User messages: use textContent for security
        p.textContent = part.trim();
      }

      d.appendChild(p);
    });
    log.appendChild(d);
    scrollDown();
    return d;
  }

  function showTyping() {
    var t = document.createElement('div');
    t.className = 'typing';
    t.setAttribute('role', 'status');
    t.setAttribute('aria-label', 'Assistant is typing');
    for (var i = 0; i < 3; i++) t.appendChild(document.createElement('span'));
    log.appendChild(t);
    scrollDown();
    return t;
  }

  function setBusy(state) {
    busy = state;
    send.disabled = state;
    input.disabled = state;
  }

  // --- open / close -------------------------------------------------
  function openChat() {
    panel.hidden = false;
    launcher.hidden = true;
    launcher.setAttribute('aria-expanded', 'true');
    input.focus();
    scrollDown();
  }
  function closeChat() {
    panel.hidden = true;
    launcher.hidden = false;
    launcher.setAttribute('aria-expanded', 'false');
    launcher.focus();
  }
  launcher.addEventListener('click', openChat);
  closeBtn.addEventListener('click', closeChat);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) closeChat();
  });

  // --- example question chips ---------------------------------------
  if (suggestions) {
    suggestions.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        if (busy) return;
        input.value = b.textContent.trim();
        if (form.requestSubmit) form.requestSubmit();
        else form.dispatchEvent(new Event('submit', { cancelable: true }));
      });
    });
  }

  // --- send a message -------------------------------------------------
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;

    var text = input.value.trim();
    if (!text) return;

    // Retire the example questions once the visitor engages.
    if (suggestions) { suggestions.remove(); suggestions = null; }

    bubble(text, 'user');
    messages.push({ role: 'user', content: text });
    input.value = '';
    setBusy(true);

    var dots = showTyping();

    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messages })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        dots.remove();
        var reply = (data && data.reply) || 'Sorry, I did not catch that.';
        bubble(reply, 'bot');
        messages.push({ role: 'assistant', content: reply });
      })
      .catch(function () {
        dots.remove();
        bubble('Sorry — I could not connect just now. Please call us at ' + PHONE + '.', 'bot');
      })
      .finally(function () {
        setBusy(false);
        input.focus();
      });
  });
})();
</script>
</body>
</html>
